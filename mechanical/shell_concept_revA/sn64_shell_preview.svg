<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
<rect width="1200" height="760" fill="#f5f7fa"/>
<text x="600" y="45" text-anchor="middle" font-family="Arial" font-size="26" font-weight="bold" fill="#1f2937">SN 64 cartridge shell — concept Rev A</text>
<text x="600" y="73" text-anchor="middle" font-family="Arial" font-size="15" fill="#667085">Exploded preview • dimensions are provisional until connector and host fit are measured</text>
<!-- upper shell, isometric block -->
<polygon points="195,180 690,125 900,220 410,280" fill="#556779" fill-opacity=".88" stroke="#273646" stroke-width="3"/>
<polygon points="195,180 410,280 410,365 195,265" fill="#344454" fill-opacity=".9" stroke="#273646" stroke-width="3"/>
<polygon points="410,280 900,220 900,305 410,365" fill="#253442" fill-opacity=".93" stroke="#273646" stroke-width="3"/>
<!-- top SNES throat -->
<polygon points="410,181 665,153 715,177 460,207" fill="#0d1720" stroke="#a8c9f2" stroke-width="3"/>
<text x="600" y="140" text-anchor="middle" font-family="Arial" font-size="16" fill="#1f5b9c">female SNES / SFC cartridge opening</text>
<!-- lower shell -->
<polygon points="195,450 690,395 900,490 410,550" fill="#3d4a57" fill-opacity=".88" stroke="#273646" stroke-width="3"/>
<polygon points="195,450 410,550 410,635 195,535" fill="#202b38" fill-opacity=".95" stroke="#273646" stroke-width="3"/>
<polygon points="410,550 900,490 900,575 410,635" fill="#17222c" fill-opacity=".95" stroke="#273646" stroke-width="3"/>
<!-- pcb -->
<polygon points="305,355 670,315 795,370 430,412" fill="#168052" stroke="#0c5a39" stroke-width="3"/>
<text x="560" y="342" text-anchor="middle" font-family="Arial" font-size="16" fill="#075c38">future PCB cavity / mounting bosses</text>
<!-- N64 edge -->
<polygon points="475,628 650,607 720,638 545,662" fill="#d5a524" stroke="#8d6a0d" stroke-width="3"/>
<polygon points="545,662 720,638 720,694 545,718" fill="#a87912" stroke="#8d6a0d" stroke-width="3"/>
<text x="790" y="666" font-family="Arial" font-size="16" fill="#765900">male N64 edge / contact tongue</text>
<line x1="720" y1="650" x2="780" y2="650" stroke="#765900" stroke-width="2"/>
<!-- USB C side -->
<polygon points="895,340 955,330 985,343 925,354" fill="#aeb6c0" stroke="#59636e" stroke-width="3"/>
<polygon points="925,354 985,343 985,385 925,396" fill="#7d8792" stroke="#59636e" stroke-width="3"/>
<text x="1000" y="365" font-family="Arial" font-size="16" fill="#59636e">USB-C</text>
<text x="1000" y="387" font-family="Arial" font-size="13" fill="#59636e">service/update opening</text>
<!-- callout arrows -->
<line x1="300" y1="300" x2="150" y2="330" stroke="#344454" stroke-width="2"/>
<text x="40" y="325" font-family="Arial" font-size="15" fill="#344454">upper shell</text>
<text x="40" y="345" font-family="Arial" font-size="13" fill="#667085">126 × 78 × 30 mm envelope</text>
<line x1="320" y1="570" x2="140" y2="605" stroke="#344454" stroke-width="2"/>
<text x="35" y="603" font-family="Arial" font-size="15" fill="#344454">lower shell</text>
<text x="35" y="623" font-family="Arial" font-size="13" fill="#667085">split plane and bosses are adjustable</text>
<!-- legend -->
<rect x="35" y="700" width="1130" height="38" rx="8" fill="#e8edf3"/>
<text x="55" y="725" font-family="Arial" font-size="14" fill="#475467">Blue = SNES connector keep-out   •   Green = PCB envelope   •   Gold = N64 edge keep-out   •   Gray = USB-C receptacle keep-out</text>
</svg>
